# Local dev infra for cart-rest-service only. It brings up cart's own dependencies alone.
# The centralized docker-compose.infra.yml at the gskart/ root is the source of truth for all the services.
name: gskart-cart

services:
  mongo:
    # Fixing mongo version to 7.0 because 8.0's kernel-version gate rejects OrbStack's (local) newer VM kernel (7.x)
    image: mongo:7.0
    container_name: cart-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      CART_MONGO_DATABASE: ${CART_MONGO_DATABASE}
      CART_MONGO_USER: ${CART_MONGO_USER}
      CART_MONGO_PASSWORD: ${CART_MONGO_PASSWORD}
    volumes:
      - cart-mongo-data:/data/db
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_ROOT_USERNAME}", "-p", "${MONGO_ROOT_PASSWORD}", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.0
    container_name: cart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${CART_REDIS_PASSWORD}"]
    volumes:
      - cart-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Passing the password via `-a` makes redis-cli warn and leaves it visible in the command line,
    # so it goes in REDISCLI_AUTH instead, which redis-cli picks up on its own.
    environment:
      REDISCLI_AUTH: ${CART_REDIS_PASSWORD}

  kafka:
    image: apache/kafka:4.3.1
    container_name: cart-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      # Only one replica is possible with a single broker, so the offsets topic is set to 1.
      # At the default (3), __consumer_offsets is never created and consumer groups stop coordinating.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    volumes:
      - cart-kafka-data:/var/lib/kafka/data

volumes:
  cart-mongo-data:
  cart-redis-data:
  cart-kafka-data:
