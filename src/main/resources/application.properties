# Application configuration
spring.application.name=cart-service
server.port=4013

#Redis connection
gskart.redis.server=localhost
gskart.redis.password=${CART_REDIS_PASSWORD}
gskart.redis.port=6379
# Cache TTL in minutes
gskart.redis.ttl=60

#Mongo config
gskart.mongo.host=localhost
gskart.mongo.port=27017
gskart.mongo.databaseName=${CART_MONGO_DATABASE}
gskart.mongo.username=${CART_MONGO_USER}
gskart.mongo.password=${CART_MONGO_PASSWORD}
gskart.order-service.url=http://localhost:4014

#Resource server (validates JWTs locally against auth's JWKS)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:4011/oauth2/jwks

#Kafka properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=cart-service
